<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/finalyzeqrcode.css">
    <title>Finalyze QR code</title>
</head>
<body>
    <header class="headerContainerMain">
        <div class="headerLogoNameDiv"><img src="./images/logoQRCode.svg" alt="logo"><p>linqr</p></div>
        <div class="headerThreeLinksDiv"><button class="btnWantsToBeLink" id="headerHowItWorksBTN">Here's how it works</button> <a href="" class="headerLink">Imprint</a> <a href="" class="headerLink">Privacy Policy</a></div>
        <div class="headerSettingsbtnDiv"><button class="button" id="headerSettingsBTN">Settings</button></div>
    </header>
    <main>
        <section>
            <div><a href="./index.html">New link</a> <p></p></div>
            <div>
                QR CODE LIVE Preview
            </div>
        </section>
        <section>
            <h1 class="sizeONEHeader">Your code is ready</h1>

            <div class="option-group" data-category="designs">
                <label for="" class="sizeTWOHeader">Designs</label>
                <div></div>
            </div>

            <div class="option-group" data-category="frame">
                <label for="" class="sizeTWOHeader">Frame</label>
                <div><button class="settingsOptionButton" data-id="none"></button> <button class="settingsOptionButton" data-id="bars"></button> <button class="settingsOptionButton" data-id="bubble"></button> <button class="settingsOptionButton" data-id="corners"></button></div>
                <div><input type="text" id="textToInputField"></div>
            </div>

            <div class="option-group" data-category="pattern">
                <label for="" class="sizeTWOHeader">Pattern</label>
                <div><button class="settingsOptionButton" data-id="squares"></button> <button class="settingsOptionButton" data-id="round"></button> <button class="settingsOptionButton" data-id="dots"></button> <button class="settingsOptionButton" data-id="lines"></button></div>
            </div>

            <div class="option-group" data-category="corners">
                <label for="" class="sizeTWOHeader">Corners</label>
                <div><button class="settingsOptionButton" data-id="sharp"></button> <button class="settingsOptionButton" data-id="rounded"></button> <button class="settingsOptionButton" data-id="circle"></button></div>
            </div>

            <div class="option-group" data-category="symbolCenter">
                <label for="" class="sizeTWOHeader">Symbol in the center</label>
                <div><button class="settingsOptionButton" data-id="none"></button> <button class="settingsOptionButton" data-id="brand"></button> <button class="settingsOptionButton" data-id="link"></button> <button class="settingsOptionButton" data-id="star"></button> <button class="settingsOptionButton" data-id="heart"></button> <button class="settingsOptionButton" id="uploadImageButton">Upload</button></div>
                <div></div>
            </div>

            <div>
                <label for="" class="sizeTWOHeader">Colors</label>
                <div class="colorsOption-group" data-category="codeColors">
                    <label for="" class="sizeTHREEHeader">Code</label>
                    <div><button class="settingsColorOptionButton" data-id="codeColorOne"></button> <button class="settingsColorOptionButton" data-id="codeColorTwo"></button> <button class="settingsColorOptionButton" data-id="codeColorThree"></button> <button class="settingsColorOptionButton" data-id="codeColorFour"></button> <button class="settingsColorOptionButton" data-id="codeColorFive"></button> <div id="codePickOwnColorDiv">Farbe wählen</div></div>
                </div>
                <div class="colorsOption-group" data-category="codeBackgroundColors">
                    <label for="" class="sizeTHREEHeader">Background</label>
                    <div><button class="settingsColorOptionButton" data-id="backColorOne"></button> <button class="settingsColorOptionButton" data-id="backColorTwo"></button> <button class="settingsColorOptionButton" data-id="backColorThree"></button> <button class="settingsColorOptionButton" data-id="backColorFour"></button> <button class="settingsColorOptionButton" data-id="backColorFive"></button><div id="backPickOwnColorDiv">Farbe wählen</div></div>
                </div>
            </div>

            <div class="sizeOption-group" data-category="size">
                <div><label for="" class="sizeTWOHeader">Size</label> <span id="pxAndUnitOutputSpan">px~cm</span></div>
                <div></div>  
                <div><button class="settingsOptionButton" data-id="businessCard"></button><button class="settingsOptionButton" data-id="web"></button><button class="settingsOptionButton" data-id="poster"></button></div>
            </div>

            <div class="downloadPrint-group" data-category="printDown">
                <div><button id="downloadPNGBtn"></button></div>
                <div><button class="svgPrintBtns" id="downloadAsSVGBtn"></button><button class="svgPrintBtns" id="printButton"></button></div>
            </div>
        </section>
    </main>
    <footer class="footerContainerMain"><div class="copyYearNameFooter">&copy; 2026 linqr</div> <div class="imprintAndPrivacyFooterDiv"><a href="" class="footerLink">Imprint</a> <a href="" class="footerLink">Privacy Policy</a></div></footer>
</body>
</html>
